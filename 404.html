<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F3D2B" />
    <meta
      name="description"
      content="BlockVault — Blockchain-based academic certificate verification platform. Secure, transparent, and trusted."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <title>BlockVault — Blockchain Academic Certificate Verification</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect for BlockVault (HashRouter)
      var l = window.location;
      var fullUrl = l.href;
      var pathname = l.pathname;
      var repoBase = '/Blockvault-1';

      // 1. Detect any Certificate ID anywhere in URL (BV-YYYY-XXXXXXXX)
      var certMatch = fullUrl.match(/BV-[0-9]{4}-[A-Za-z0-9]+/i);
      var targetHash = '';

      if (certMatch) {
        targetHash = '#/verify/' + certMatch[0].toUpperCase();
      } else if (pathname.indexOf('/verify') !== -1) {
        targetHash = '#/verify';
      } else if (pathname.indexOf('/admin') !== -1) {
        var adminIdx = pathname.indexOf('/admin');
        targetHash = '#' + pathname.substring(adminIdx);
      } else if (l.hash && l.hash.length > 1) {
        targetHash = l.hash;
      } else {
        // Strip repo prefix if present
        var stripped = pathname.replace(/^\/(?:Blockvault-1|p2)\/?/i, '');
        targetHash = stripped ? '#/' + stripped : '#/';
      }

      // Preserve query params if present
      if (l.search && l.search.indexOf('?id=') !== -1 && !certMatch) {
        targetHash += (targetHash.indexOf('?') === -1 ? '?' : '&') + l.search.substring(1);
      }

      var dest = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoBase + '/' + targetHash;
      window.location.replace(dest);
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
