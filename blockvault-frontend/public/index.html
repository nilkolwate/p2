<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F3D2B" />
    <meta
      name="description"
      content="BlockVault — Blockchain-based academic certificate verification platform. Secure, transparent, and trusted."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <title>BlockVault — Blockchain Academic Certificate Verification</title>
    <script type="text/javascript">
      // Ensure SPA query redirects from older QR codes convert to HashRouter hash
      (function() {
        var query = window.location.search;
        if (query) {
          var certMatch = query.match(/BV-[0-9]{4}-[A-Za-z0-9]+/i);
          if (certMatch) {
            window.location.replace(window.location.pathname + '#/verify/' + certMatch[0].toUpperCase());
          } else if (query.indexOf('?/verify') !== -1) {
            window.location.replace(window.location.pathname + '#/verify');
          }
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
